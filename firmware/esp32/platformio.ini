; Optional PlatformIO wrapper around the ESP-IDF project (same sources and
; sdkconfig defaults as `idf.py`). Usage:
;   pio run -e esp32s3-breadboard -t upload -t monitor
[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The same table sdkconfig.defaults names: two app slots for over-the-air updates.
board_build.partitions = partitions.csv
; Fails the build when the app leaves under 10% of its slot (tools/check_size.py).
extra_scripts = post:tools/pio_checks.py

[env:esp32s3-breadboard]
board = esp32-s3-devkitc-1
; 4 MB, as in sdkconfig: the image header then suits 4, 8 and 16 MB modules.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/esp32s3-breadboard/sdkconfig.defaults"

[env:esp32s3-touch-amoled-175]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/esp32s3-touch-amoled-175/sdkconfig.defaults"

; Waveshare ESP32-S3-LCD-1.54: needs no wiring and nothing to connect, the
; speaker is onboard.
[env:esp32s3-lcd-154]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/waveshare-esp32s3-lcd-154/sdkconfig.defaults"

; ESP32-2432S028R "Cheap Yellow Display": a classic ESP32 (no PSRAM) with a
; 2.8" ILI9341 touchscreen and a DAC speaker output. The microphone is an
; INMP441 on the expansion pins (docs/hardware.md).
[env:esp32-cyd]
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_speed = 921600
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/esp32-cyd/sdkconfig.defaults"
